name: Workflows and scripts

# The other half of ci.yml's path filter. That job proves the Rust code
# builds; this one proves the things that ship *around* it are valid — and it
# is cheap, so it runs on the changes ci.yml deliberately ignores.
#
# It exists because nothing checked these before: a YAML anchor that parses
# locally but is unsupported by GitHub Actions, or a bashism in a POSIX
# install script, both reached main unnoticed until they failed for real.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'Makefile'
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'Makefile'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint workflows and scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # actionlint understands workflow *semantics*, not just YAML: unknown
      # `uses:` refs, bad expressions, invalid runner labels, and — the case
      # that matters here — anchors, which are valid YAML and rejected by
      # Actions. It also shellchecks every `run:` block.
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

      # install.sh is piped into whatever shell a user has, so it is POSIX sh
      # rather than bash. `sh -n` catches syntax; shellcheck -s sh catches the
      # bashisms that would only fail on dash or ash.
      # `make help` parses the whole file and runs nothing, so a broken
      # target or a tab/space mistake fails here rather than the first time
      # someone runs it.
      - name: Makefile parses
        run: make help

      - name: Shell scripts
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          for f in scripts/*.sh; do
            echo "--- $f"
            sh -n "$f"
            shellcheck -s sh "$f"
          done
