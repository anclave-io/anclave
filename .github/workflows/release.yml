name: Release

# The tag is the decision, so there is no version commit to keep in step with
# it and no way for the two to disagree.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          # Graviton, Pi, and most arm CI. A native runner is available, so
          # this one is not cross-compiled.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          # Cross-compiled: the Intel `macos-13` runners are being retired and
          # are scarce enough that this leg starved for 12 minutes on v0.1.0
          # while the rest finished, and `publish` needs all four. Xcode ships
          # both SDKs, so an arm64 runner still produces a real x86_64 binary.
          - target: x86_64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
             --bin anclaved --bin anclave --bin anclave-cli

      - name: Package
        id: package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME}"
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && version="${{ github.event.inputs.tag }}"
          name="anclave-${version}-${{ matrix.target }}.tar.gz"
          dir="target/${{ matrix.target }}/release"
          # Archive the binaries at the top level: the installer copies them
          # out by name and should not have to know a directory layout.
          tar -czf "$name" -C "$dir" anclaved anclave anclave-cli
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: ${{ steps.package.outputs.name }}

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        shell: bash
        run: |
          version="${GITHUB_REF_NAME}"
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && version="${{ github.event.inputs.tag }}"
          cd artifacts
          # One file, named for the version, in the format the installer
          # greps: "<sha256>  <archive name>".
          sha256sum *.tar.gz > "anclave-${version}-checksums.txt"
          cat "anclave-${version}-checksums.txt"

      # Re-tagging is ordinary — a workflow fix, a bad build. On the second
      # run the release already exists, and GitHub's generate_release_notes
      # *appends* to the existing body rather than replacing it: that is how
      # v0.1.0 ended up with two "What's Changed" sections.
      - name: Remove any existing release for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::replacing the existing release for $tag"
            # --cleanup-tag=false: the tag is this workflow's input, not its
            # output. Deleting it would strand the run using it.
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag=false
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
