name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            smoke: true
          # arm64 Linux is Graviton, Pi, and most arm CI. Native runner rather
          # than cross-compilation so the artifact is built the same way as
          # every other one.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            smoke: true
          - target: aarch64-apple-darwin
            os: macos-latest
            smoke: true
          # Cross-compiled on Apple silicon, so it cannot be run here and is
          # not smoke tested. The one artifact published unexercised.
          - target: x86_64-apple-darwin
            os: macos-latest
            smoke: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
             --bin anclaved --bin anclave --bin anclave-cli

      - name: Package
        id: package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME}"
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && version="${{ github.event.inputs.tag }}"
          name="anclave-${version}-${{ matrix.target }}.tar.gz"
          dir="target/${{ matrix.target }}/release"
          # Archive the binaries at the top level: the installer copies them
          # out by name and should not have to know a directory layout.
          tar -czf "$name" -C "$dir" anclaved anclave anclave-cli
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # Drive the packaged binaries before publishing them. 0.2.0 shipped
      # with input delivering nothing and capture returning a blank screen,
      # past a green suite: the tests asserted the calls returned rather than
      # that anything happened. Unpack the archive rather than reaching into
      # target/, so this exercises exactly what a user downloads.
      - name: Smoke test the archive
        if: matrix.smoke
        shell: bash
        run: |
          if ! command -v tmux >/dev/null; then
            case "${{ runner.os }}" in
              Linux) sudo apt-get update && sudo apt-get install -y tmux ;;
              macOS) brew install tmux ;;
            esac
          fi
          mkdir -p smoke-bin
          tar -xzf "${{ steps.package.outputs.name }}" -C smoke-bin
          scripts/smoke.sh smoke-bin

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: ${{ steps.package.outputs.name }}

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        shell: bash
        run: |
          version="${GITHUB_REF_NAME}"
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && version="${{ github.event.inputs.tag }}"
          cd artifacts
          # One file, named for the version, in the format the installer
          # greps: "<sha256>  <archive name>".
          # `--` rather than `./*.tar.gz`: the installer matches each line with
          # `grep " $name$"`, so a `./` prefix in the checksum file would stop
          # every lookup matching and silently skip verification.
          sha256sum -- *.tar.gz > "anclave-${version}-checksums.txt"
          cat "anclave-${version}-checksums.txt"

      - name: Remove any existing release for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::replacing the existing release for $tag"
            # --cleanup-tag=false: the tag is this workflow's input, not its
            # output. Deleting it would strand the run using it.
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag=false
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
