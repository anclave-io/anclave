name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the first: only the tip matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Format, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # The daemon's backend shells out to tmux, and only tmux_backend.rs
      # guards on its absence — the CLI end-to-end tests create real sessions
      # and would fail rather than skip. Installing it keeps CI honest instead
      # of quietly running a smaller suite than it appears to.
      - name: Install tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux
          tmux -V

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace
