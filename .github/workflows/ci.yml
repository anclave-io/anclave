name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the first: only the tip matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Format, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # The daemon's backend shells out to tmux, and only tmux_backend.rs
      # guards on its absence — the CLI end-to-end tests create real sessions
      # and would fail rather than skip. Installing it keeps CI honest instead
      # of quietly running a smaller suite than it appears to.
      #
      # podman is what makes the containment tests run: on Linux it needs no
      # VM, so a runner can actually start a container. Without it those tests
      # skip, and the security claims go unchecked on every push.
      - name: Install tmux and podman
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux podman
          tmux -V
          podman --version
          # docker is preinstalled and running on GitHub's Linux runners, so
          # the containment tests exercise both backends here without any
          # extra setup. Report it rather than assume it.
          docker version --format '{{.Server.Version}}' || echo "docker unavailable"

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace

      # The containment tests skip when podman cannot run, which would make a
      # broken runner look like a passing build. This asserts they actually
      # ran, so the security coverage cannot silently disappear.
      # The containment tests skip when no runtime can start a container,
      # which would make a broken runner look like a passing build. Assert
      # they actually ran: a skipped security test reporting success is worse
      # than a missing one.
      - name: Confirm containment tests ran
        run: |
          output=$(cargo test -p anclaved --test containment -- --nocapture 2>&1)
          echo "$output"
          echo "$output" | grep -qE "^test result: ok\. 4 passed" || {
            echo "::error::containment tests did not run — no container runtime on this runner"
            exit 1
          }
