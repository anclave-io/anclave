name: CI

on:
  push:
    branches: [main]
    paths: &rust_paths
      - '**/*.rs'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/ci.yml'
  pull_request:
    paths: *rust_paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Format, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install tmux and podman
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux podman
          tmux -V
          podman --version
          # docker is preinstalled and running on GitHub's Linux runners, so
          # the containment tests exercise both backends here without any
          # extra setup. Report it rather than assume it.
          docker version --format '{{.Server.Version}}' || echo "docker unavailable"

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace

      # The containment tests skip when podman cannot run, which would make a
      # broken runner look like a passing build. This asserts they actually
      # ran, so the security coverage cannot silently disappear.
      # The containment tests skip when no runtime can start a container,
      # which would make a broken runner look like a passing build. Assert
      # they actually ran: a skipped security test reporting success is worse
      # than a missing one.
      - name: Confirm containment tests ran
        run: |
          output=$(cargo test -p anclaved --test containment -- --nocapture 2>&1)
          echo "$output"
          echo "$output" | grep -qE "^test result: ok\. 4 passed" || {
            echo "::error::containment tests did not run: no container runtime on this runner"
            exit 1
          }
          # Both backends must be covered. A probe that works on one runtime
          # and not the other silently halves this suite while still passing,
          # which is how it broke once already.
          for runtime in podman docker; do
            echo "$output" | grep -q "runtimes exercised.*$runtime" || {
              echo "::error::$runtime was not exercised by the containment tests"
              exit 1
            }
          done
