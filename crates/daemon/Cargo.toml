[package]
name = "anclaved"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "anclaved"
path = "src/main.rs"

[dependencies]
anclave-protocol = { path = "../protocol" }
anclave-terminal = { path = "../terminal" }
anclave-security = { path = "../security" }
anclave-audit = { path = "../audit" }
anclave-workspace = { path = "../workspace" }
rusqlite = { version = "0.40", features = ["bundled"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml = "1"

[dev-dependencies]
tempfile = "3"
