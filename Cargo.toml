[workspace]
members = [
    "crates/protocol",
    "crates/daemon",
    "crates/cli",
    "crates/terminal",
    "crates/tui",
    "crates/workspace",
    "crates/security",
    "crates/audit",
    "crates/architecture",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.2.2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "io-util", "time"] }
ratatui = "0.30"
crossterm = "0.29"
